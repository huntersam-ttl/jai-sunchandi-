name: PostgreSQL security and concurrency

on:
  pull_request:
    branches: [feat/supabase-v1]

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jai_sunchandi_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d jai_sunchandi_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Initialize disposable database schema
        env:
          PGPASSWORD: ci_password
        run: |
          set -euo pipefail
          psql --host=127.0.0.1 --port=5432 --username=ci --dbname=jai_sunchandi_ci \
            --file=supabase/ci_bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql --set=ON_ERROR_STOP=1 --host=127.0.0.1 --port=5432 \
              --username=ci --dbname=jai_sunchandi_ci --file="${migration}"
          done

      - name: Run mandatory PostgreSQL concurrency tests
        env:
          PYTHONPATH: backend
          REACT_APP_BACKEND_URL: http://127.0.0.1:9
          TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci_password@127.0.0.1:5432/jai_sunchandi_ci
        run: |
          set -euo pipefail
          python -m pytest -q -n 0 backend/tests/test_postgres_concurrency.py \
            --junitxml=postgres-concurrency.xml | tee postgres-concurrency.log
          grep -Eq '7 passed' postgres-concurrency.log
          ! grep -Eq '[0-9]+ skipped' postgres-concurrency.log

      - name: Run backend regression suite
        env:
          PYTHONPATH: backend
          REACT_APP_BACKEND_URL: http://127.0.0.1:9
          TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci_password@127.0.0.1:5432/jai_sunchandi_ci
        run: |
          set -euo pipefail
          python -m pytest -q -n 0 \
            backend/tests/test_data_layer.py \
            backend/tests/test_security_concurrency_guards.py \
            backend/tests/test_postgres_concurrency.py \
            --junitxml=backend-tests.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-ci-reports
          path: |
            postgres-concurrency.xml
            postgres-concurrency.log
            backend-tests.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack yarn install --frozen-lockfile --non-interactive
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: corepack yarn test --watchAll=false --runInBand
      - name: Build frontend
        working-directory: frontend
        run: corepack yarn build
